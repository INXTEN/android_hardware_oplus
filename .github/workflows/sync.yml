name: Sync with upstream

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync
        run: |
          git remote add upstream https://github.com/anshedu/${{ github.event.repository.name }}.git
          git fetch upstream
          git push origin --all
          git push origin --tags
